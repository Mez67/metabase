## Custom viz plugins get an entity_id so remote sync can track them in its ledger like every other synced model.
## Their serialization identity stays the identifier: the YAML does not carry the entity_id, and the column exists
## only to feed remote sync on one instance. Backfill mirrors 20261019_osi_ai_context_entity_id: all three dialect
## variants in one changeset so every database records it, then NOT NULL and UNIQUE.

databaseChangeLog:
  - changeSet:
      id: v65.2026-11-04T00:00:00
      author: chodorowicz
      comment: Add entity_id column to custom_viz_plugin table
      changes:
        - addColumn:
            tableName: custom_viz_plugin
            columns:
              - column:
                  name: entity_id
                  type: ${entity_id.type}
                  remarks: Random NanoID tag for unique identity.
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: custom_viz_plugin
            columnName: entity_id

  - changeSet:
      id: v65.2026-11-04T00:00:01
      author: chodorowicz
      comment: Backfill NULL custom_viz_plugin.entity_id values
      changes:
        - sql:
            dbms: postgresql
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(gen_random_uuid()::text, '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: mysql,mariadb
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(uuid(), '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: h2
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(cast(random_uuid() as varchar), '-', ''), 1, 21) WHERE entity_id IS NULL;
      rollback: []

  - changeSet:
      id: v65.2026-11-04T00:00:02
      author: chodorowicz
      comment: entity_id is NOT NULL on custom_viz_plugin
      changes:
        - addNotNullConstraint:
            tableName: custom_viz_plugin
            columnName: entity_id
            columnDataType: ${entity_id.type}

  - changeSet:
      id: v65.2026-11-04T00:00:03
      author: chodorowicz
      comment: entity_id is unique on custom_viz_plugin
      changes:
        - addUniqueConstraint:
            tableName: custom_viz_plugin
            columnNames: entity_id
            constraintName: uq_custom_viz_plugin_entity_id
      rollback:
        - dropUniqueConstraint:
            tableName: custom_viz_plugin
            constraintName: uq_custom_viz_plugin_entity_id
